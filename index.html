<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffe7ee" />
<title>A Birthday Gift for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
/* ================= base ================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  overflow:hidden;
  font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#8a3d58;
  background:radial-gradient(130% 90% at 50% 28%,#fff8f3 0%,#ffe7ee 46%,#f9c6d6 100%);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
/* --gw = gift width; every size in the scene scales from it */
.scene{
  position:fixed;inset:0;overflow:hidden;cursor:pointer;
  --gw:clamp(100px,min(50vw,31vh,calc((100vh - 120px) / 2.5)),260px);
}
.scene.has-name{--gw:clamp(100px,min(50vw,28vh,calc((100vh - 120px) / 2.8)),260px)}
@supports (height:100dvh){
  .scene{--gw:clamp(100px,min(50vw,31dvh,calc((100dvh - 120px) / 2.5)),260px)}
  .scene.has-name{--gw:clamp(100px,min(50vw,28dvh,calc((100dvh - 120px) / 2.8)),260px)}
}
.scene.open{cursor:default}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= background bokeh ================= */
.bokeh{position:absolute;inset:0;pointer-events:none}
.bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 68%);animation:drift var(--t) ease-in-out var(--dl) infinite alternate}
@keyframes drift{to{transform:translate(var(--dx),var(--dy)) scale(1.15)}}

/* ================= layout ================= */
.gift-wrap{
  position:absolute;left:50%;
  bottom:calc(50% - var(--gw) * .5);
  width:var(--gw);height:calc(var(--gw) * .88);
  transform:translateX(-50%);
  transition:bottom 1.1s cubic-bezier(.55,0,.2,1) .35s,opacity .35s ease;
  animation:dropIn .9s cubic-bezier(.3,1.35,.5,1) backwards;
}
@keyframes dropIn{0%{translate:0 -80px;opacity:0}100%{translate:0 0;opacity:1}}
.open .gift-wrap{bottom:calc(50% - var(--gw) * 1.09 + 55px)}
.has-name.open .gift-wrap{bottom:calc(50% - var(--gw) * 1.23 + 55px)}
.resetting .gift-wrap{opacity:0;transition:opacity .3s ease}

.shadow{position:absolute;left:50%;bottom:calc(var(--gw) * -.075);width:calc(var(--gw) * 1.3);height:calc(var(--gw) * .17);transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(130,40,75,.3),rgba(130,40,75,0))}

/* glow + light rays behind the bouquet */
.rays{position:absolute;left:50%;bottom:calc(var(--gw) * 1.4);width:calc(var(--gw) * 3.6);aspect-ratio:1;transform:translate(-50%,50%) scale(.5);opacity:0;pointer-events:none;transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.2,.8,.2,1)}
.rays::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.75) 0deg 6deg,rgba(255,255,255,0) 6deg 16deg);-webkit-mask:radial-gradient(circle,#000 12%,transparent 66%);mask:radial-gradient(circle,#000 12%,transparent 66%);animation:spin 50s linear infinite}
.rays::after{content:"";position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.95) 0%,rgba(255,226,236,.5) 45%,rgba(255,226,236,0) 70%)}
.open .rays{opacity:1;transform:translate(-50%,50%) scale(1);transition-delay:.55s}
.resetting .rays{transition:none}
@keyframes spin{to{transform:rotate(1turn)}}

/* ================= the gift ================= */
.gift{position:absolute;inset:0;z-index:1;transform-origin:50% 100%;outline:none;animation:wiggle 3.6s ease-in-out 1.4s infinite}
.gift:focus-visible::after{content:"";position:absolute;inset:calc(var(--gw) * -.12);border:3px dashed rgba(178,58,100,.55);border-radius:18px}
@keyframes wiggle{0%,70%,100%{transform:none}74%{transform:rotate(-3.5deg) scale(1.02)}78%{transform:rotate(3deg) scale(1.02)}82%{transform:rotate(-2deg)}86%{transform:rotate(1deg)}90%{transform:none}}
@keyframes hop{0%{transform:none}30%{transform:translateY(-9%) scale(1.02,.98)}55%{transform:translateY(0) scale(1.05,.93)}75%{transform:scale(.98,1.03)}100%{transform:none}}
@keyframes thump{0%{transform:none}30%{transform:scale(1.04,.94)}62%{transform:scale(.985,1.025)}100%{transform:none}}

.box-inner{position:absolute;left:0;right:0;bottom:calc(var(--gw) * .72 - 1px);height:calc(var(--gw) * .075);z-index:1;background:linear-gradient(#0c4f46,#178371);clip-path:polygon(5% 0,95% 0,100% 100%,0 100%)}

.box-front{
  position:absolute;left:0;right:0;bottom:0;height:calc(var(--gw) * .72);z-index:3;overflow:hidden;
  border-radius:0 0 calc(var(--gw) * .045) calc(var(--gw) * .045);
  background:
    radial-gradient(circle,rgba(255,255,255,.34) 0 calc(var(--gw) * .022),transparent calc(var(--gw) * .022 + 1px)) 0 0 / calc(var(--gw) * .16) calc(var(--gw) * .16),
    radial-gradient(circle,rgba(255,255,255,.34) 0 calc(var(--gw) * .022),transparent calc(var(--gw) * .022 + 1px)) calc(var(--gw) * .08) calc(var(--gw) * .08) / calc(var(--gw) * .16) calc(var(--gw) * .16),
    linear-gradient(180deg,#3fd0ba,#27ad99);
}
.box-front::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,55,48,.28) 0,rgba(0,55,48,0) calc(var(--gw) * .07)),
             linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,0) 28%,rgba(0,0,0,0) 72%,rgba(0,40,35,.14))}

.rib-v{position:absolute;top:0;bottom:0;left:calc(50% - var(--gw) * .085);width:calc(var(--gw) * .17);z-index:2;transform-origin:50% 0;
  background:linear-gradient(90deg,#b92e58 0,#e04774 9%,#ff6b8f 30%,#ffa3bb 50%,#ff6b8f 70%,#e04774 91%,#b92e58 100%)}
.rib-h{position:absolute;left:0;right:0;top:calc(50% - var(--gw) * .075);height:calc(var(--gw) * .15);z-index:1;transform-origin:50% 50%;
  background:linear-gradient(180deg,#b92e58 0,#e04774 9%,#ff6b8f 30%,#ffa3bb 50%,#ff6b8f 70%,#e04774 91%,#b92e58 100%)}

.tag{position:absolute;z-index:3;left:calc(var(--gw) * .04);bottom:calc(var(--gw) * .075);width:calc(var(--gw) * .36);height:calc(var(--gw) * .15);
  display:flex;align-items:center;justify-content:center;padding:0 calc(var(--gw) * .02) 0 calc(var(--gw) * .065);
  background:radial-gradient(circle at 11% 50%,#2fbaa5 0 calc(var(--gw) * .014),transparent calc(var(--gw) * .014 + .6px)),#fffaf2;
  clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%);transform:rotate(-7deg);
  font-family:"Dancing Script","Brush Script MT",cursive;font-weight:700;font-size:calc(var(--gw) * .062);color:#d23a6b}
.tag span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.lid{position:absolute;z-index:4;left:calc(var(--gw) * -.05);right:calc(var(--gw) * -.05);bottom:calc(var(--gw) * .66);height:calc(var(--gw) * .22);
  border-radius:calc(var(--gw) * .03);transform-origin:50% 100%;
  background:linear-gradient(180deg,#62e2ce 0%,#41ccb6 55%,#2fb39f 100%);
  box-shadow:0 calc(var(--gw) * .022) calc(var(--gw) * .02) rgba(0,70,60,.22),inset 0 calc(var(--gw) * .012) 0 rgba(255,255,255,.4),inset 0 calc(var(--gw) * -.014) 0 rgba(0,60,52,.12)}

.bow{position:absolute;z-index:3;left:50%;top:calc(var(--gw) * -.27);width:calc(var(--gw) * .8);margin-left:calc(var(--gw) * -.4);overflow:visible;transform-origin:50% 58%;filter:drop-shadow(0 3px 2px rgba(150,30,70,.25))}
.loop-l,.loop-r,.tail-l,.tail-r{transform-box:fill-box}
.loop-l{transform-origin:100% 85%}
.loop-r{transform-origin:0 85%}
.tail-l{transform-origin:100% 0}
.tail-r{transform-origin:0 0}

.tap-ring{position:absolute;z-index:6;left:50%;bottom:calc(var(--gw) * .71);width:calc(var(--gw) * .3);height:calc(var(--gw) * .3);margin-left:calc(var(--gw) * -.15);border-radius:50%;border:3px solid rgba(255,255,255,.95);box-shadow:0 0 12px rgba(255,255,255,.8);pointer-events:none;opacity:0;animation:ring 1.9s ease-out 1.6s infinite}
.untied .tap-ring{bottom:calc(var(--gw) * .62)}
.busy .tap-ring,.open .tap-ring{visibility:hidden}
@keyframes ring{0%{transform:scale(.45);opacity:0}25%{opacity:1}100%{transform:scale(1.7);opacity:0}}

/* ---------- tap 1: untie the ribbon ---------- */
.untied .gift{animation:hop .6s cubic-bezier(.3,.7,.4,1)}
.untied .bow{animation:bowOff 1s cubic-bezier(.45,-.2,.6,1) forwards}
.untied .loop-l{animation:loopL .5s .08s ease-out forwards}
.untied .loop-r{animation:loopR .5s .08s ease-out forwards}
.untied .tail-l{animation:tailL .45s ease-out forwards}
.untied .tail-r{animation:tailR .45s ease-out forwards}
.untied .box-front .rib-v{animation:ribUp .4s .05s cubic-bezier(.7,0,.9,.6) forwards}
.untied .rib-h{animation:ribX .4s .05s cubic-bezier(.7,0,.9,.6) forwards}
.untied .lid .rib-v{animation:ribUp .3s .38s cubic-bezier(.7,0,.9,.6) forwards}
.untied .lid{animation:lidPeek 2.8s ease-in-out 1.4s infinite}
@keyframes bowOff{0%{transform:none}18%{transform:scale(1.15,.85)}40%{transform:translateY(-25%) scale(1.05) rotate(-6deg);opacity:1}100%{transform:translate(35%,-320%) rotate(220deg) scale(.45);opacity:0}}
@keyframes loopL{to{transform:rotate(-30deg) scale(.8,.6)}}
@keyframes loopR{to{transform:rotate(30deg) scale(.8,.6)}}
@keyframes tailL{to{transform:rotate(30deg)}}
@keyframes tailR{to{transform:rotate(-30deg)}}
@keyframes ribUp{to{transform:scaleY(0)}}
@keyframes ribX{to{transform:scaleX(0)}}
@keyframes lidPeek{0%,70%,100%{transform:none}75%{transform:translateY(-18%) rotate(-2.5deg)}80%{transform:none}85%{transform:translateY(-9%) rotate(2deg)}90%{transform:none}}

/* ---------- tap 2: lift the lid, bouquet pops ---------- */
.open .gift{animation:thump .55s ease-out}
.open .lid{animation:lidOff 1s cubic-bezier(.3,.1,.5,1) forwards}
@keyframes lidOff{0%{transform:none}20%{transform:translateY(-45%) rotate(-5deg)}100%{transform:translate(150%,-650%) rotate(80deg);opacity:0}}

.bouquet{position:absolute;z-index:2;left:50%;bottom:calc(var(--gw) * .48);width:calc(var(--gw) * 1.3);margin-left:calc(var(--gw) * -.65);transform-origin:50% 100%;opacity:0;pointer-events:none}
.bouquet svg{display:block;width:100%;height:auto;overflow:visible}
.sway{transform-origin:50% 90%}
.open .bouquet{animation:bouquetPop 1.25s cubic-bezier(.2,.8,.25,1) .28s both}
.open .sway{animation:sway 6s ease-in-out 2.2s infinite}
@keyframes bouquetPop{0%{transform:translateY(24%) scale(.35);opacity:0}6%{opacity:1}55%{transform:translateY(-7%) scale(1.05)}75%{transform:translateY(1.5%) scale(.985)}100%{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(1.3deg)}75%{transform:rotate(-1.3deg)}}

.bloom{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0)}
.leaf>.bloom{transform-origin:50% 100%}
.open .bloom{animation:bloom .8s cubic-bezier(.3,1.55,.5,1) var(--d,.6s) both}
.open .leaf>.bloom{animation-name:grow}
@keyframes bloom{0%{transform:scale(0) rotate(-50deg)}100%{transform:none}}
@keyframes grow{0%{transform:scale(0)}100%{transform:none}}
.stem{fill:none;stroke:#3f9a5f;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.open .stem{animation:draw .7s ease-out .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- greeting ---------- */
.greeting{position:absolute;z-index:5;left:50%;bottom:calc(var(--gw) * 2.02);width:min(94vw,680px);transform:translateX(-50%);text-align:center;pointer-events:none;
  font-family:"Dancing Script","Brush Script MT",cursive;font-weight:700;font-size:calc(var(--gw) * .27);line-height:1.08}
.word{display:inline-block;opacity:0;padding:0 .06em .12em;color:#d6336c;
  text-shadow:0 2px 0 #fff,0 6px 16px rgba(214,51,108,.25)}
.open .word{animation:wordPop .8s cubic-bezier(.2,1.5,.4,1) calc(1.35s + var(--i) * .16s) both}
@keyframes wordPop{0%{opacity:0;transform:translateY(40%) scale(.4) rotate(-8deg)}100%{opacity:1;transform:none}}

/* ---------- caption: hint → message ---------- */
.caption{position:absolute;z-index:5;left:50%;top:calc(100% + var(--gw) * .14);width:min(88vw,430px);transform:translateX(-50%);text-align:center}
.hint{display:inline-flex;align-items:center;gap:.6em;padding:.6em 1.15em;border-radius:999px;
  font-weight:700;font-size:clamp(14px,calc(var(--gw) * .072),18px);letter-spacing:.01em;color:#a2405f;
  background:rgba(255,255,255,.6);box-shadow:0 6px 18px rgba(160,60,90,.13);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:opacity .25s,transform .25s}
.hint.swap{opacity:0;transform:translateY(6px)}
.hint-dot{width:.6em;height:.6em;border-radius:50%;background:#ff6b8f}
.open .hint{opacity:0;transform:translateY(8px);visibility:hidden;transition:opacity .3s,transform .3s,visibility 0s .3s}
.after{position:absolute;left:0;right:0;top:0}
.message{font-size:clamp(14px,calc(var(--gw) * .076),19px);font-weight:600;line-height:1.45;color:#8a3d58;opacity:0}
.open .message{animation:fadeUp .9s ease 2.2s both}
.replay{margin-top:.9em;display:inline-flex;align-items:center;gap:.45em;padding:.62em 1.15em;border:0;border-radius:999px;cursor:pointer;
  font:700 15px "Quicksand",system-ui,sans-serif;color:#b23a64;background:rgba(255,255,255,.72);box-shadow:0 6px 18px rgba(160,60,90,.14);
  opacity:0;visibility:hidden;transition:translate .2s}
.replay svg{width:17px;height:17px}
.replay:hover{translate:0 -2px}
.replay:focus-visible,.sound:focus-visible{outline:3px solid #ff6b8f;outline-offset:3px}
.open .replay{visibility:visible;animation:fadeUp .6s ease 3.6s both}
@keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}

/* ---------- chrome ---------- */
.sound{position:fixed;z-index:30;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));width:44px;height:44px;border:0;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;color:#b23a64;background:rgba(255,255,255,.62);box-shadow:0 6px 18px rgba(160,60,90,.14);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sound svg{width:22px;height:22px}
.sound .off{display:none}
.sound[aria-pressed="false"] .on{display:none}
.sound[aria-pressed="false"] .off{display:block}
#fx{position:fixed;inset:0;z-index:20;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .gift,.untied:not(.open) .lid,.bokeh i,.rays::before,.open .sway{animation:none}
  .tap-ring{animation:none;opacity:.7;transform:scale(1)}
}
</style>
</head>
<body>
<main id="scene" class="scene">
  <div class="bokeh" aria-hidden="true"></div>

  <div class="gift-wrap">
    <div class="rays" aria-hidden="true"></div>
    <h1 id="greet" class="greeting"></h1>
    <div class="shadow" aria-hidden="true"></div>

    <div id="gift" class="gift" role="button" tabindex="0" aria-label="A wrapped birthday gift. Tap to untie the ribbon.">
      <div class="box-inner"></div>

      <!-- bouquet hides inside the box until the lid comes off -->
      <div class="bouquet" aria-hidden="true"><div class="sway">
        <svg viewBox="0 0 300 400">
          <defs>
            <linearGradient id="tissueA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5f8"/><stop offset="1" stop-color="#ffc7d8"/></linearGradient>
            <linearGradient id="tissueB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdce7"/><stop offset="1" stop-color="#f5a3bc"/></linearGradient>
            <linearGradient id="kraftL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4d3a4"/><stop offset="1" stop-color="#d9a066"/></linearGradient>
            <linearGradient id="kraftR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4b47c"/><stop offset="1" stop-color="#c4864a"/></linearGradient>
            <linearGradient id="tieG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa3bb"/><stop offset="1" stop-color="#e04774"/></linearGradient>
            <linearGradient id="leafA" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f8f58"/><stop offset="1" stop-color="#72d293"/></linearGradient>
            <linearGradient id="leafB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3a9d6a"/><stop offset="1" stop-color="#a3dfb8"/></linearGradient>
          </defs>
          <g>
            <path d="M150,352 L30,66 L104,100 L150,34 L196,100 L270,66 Z" fill="url(#tissueB)" stroke="#f3a3bd" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M150,352 L10,112 L58,124 L84,52 L150,92 L216,52 L242,124 L290,112 Z" fill="url(#tissueA)" stroke="#f6bfd0" stroke-width="1.2" stroke-linejoin="round"/>
          </g>
          <g id="bq-leaves"></g>
          <g id="bq-stems"></g>
          <g id="bq-flowers"></g>
          <g>
            <path d="M44,196 Q108,206 172,236 L152,386 Q138,386 126,376 Z" fill="url(#kraftL)"/>
            <path d="M62,208 L134,378" stroke="#f9e2bf" stroke-width="1.4" opacity=".6"/>
            <path d="M256,196 Q192,206 128,236 L148,386 Q162,386 174,376 Z" fill="url(#kraftR)"/>
            <path d="M234,208 L166,378" stroke="#b5763c" stroke-width="1.2" opacity=".35"/>
            <path d="M44,196 Q97,204 150,226" stroke="#fde7c8" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M256,196 Q203,204 150,226" stroke="#eec694" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M90,294 Q150,310 210,294 L206,311 Q150,327 94,311 Z" fill="url(#tieG)"/>
            <path d="M147,313 L133,344 L140,340 L143,349 L153,315 Z" fill="#e04774"/>
            <path d="M153,313 L167,344 L160,340 L157,349 L147,315 Z" fill="#cf3a66"/>
            <path d="M150,310 C136,292 116,294 118,306 C120,318 138,318 150,310 Z" fill="url(#tieG)"/>
            <path d="M150,310 C164,292 184,294 182,306 C180,318 162,318 150,310 Z" fill="url(#tieG)"/>
            <circle cx="150" cy="310" r="6.5" fill="#d63d6a"/>
          </g>
        </svg>
      </div></div>

      <div class="box-front">
        <div class="rib-h"></div>
        <div class="rib-v"></div>
        <div class="tag"><span id="tagText">For you</span></div>
      </div>

      <div class="lid">
        <div class="rib-v"></div>
        <svg class="bow" viewBox="0 0 200 124" aria-hidden="true">
          <defs>
            <linearGradient id="bowG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb3c7"/><stop offset=".55" stop-color="#ff6b8f"/><stop offset="1" stop-color="#e04774"/></linearGradient>
            <linearGradient id="bowK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fab"/><stop offset="1" stop-color="#cf3a66"/></linearGradient>
          </defs>
          <path class="tail-l" d="M92,72 L62,114 L73,112 L78,122 L104,78 Z" fill="#e04774"/>
          <path class="tail-r" d="M108,72 L138,114 L127,112 L122,122 L96,78 Z" fill="#d63d6a"/>
          <g class="loop-l">
            <path d="M100,72 C78,40 34,22 24,46 C15,68 56,86 100,72 Z" fill="url(#bowG)"/>
            <path d="M100,72 C82,56 54,48 46,57 C40,66 68,77 100,72 Z" fill="#c9325f" opacity=".55"/>
            <path d="M94,62 C78,42 44,30 32,44" stroke="#ffd3de" stroke-width="3" fill="none" stroke-linecap="round" opacity=".75"/>
          </g>
          <g class="loop-r">
            <path d="M100,72 C122,40 166,22 176,46 C185,68 144,86 100,72 Z" fill="url(#bowG)"/>
            <path d="M100,72 C118,56 146,48 154,57 C160,66 132,77 100,72 Z" fill="#c9325f" opacity=".55"/>
            <path d="M106,62 C122,42 156,30 168,44" stroke="#ffd3de" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
          </g>
          <rect id="bowKnot" x="88" y="60" width="24" height="24" rx="8" fill="url(#bowK)"/>
          <path d="M93,66 Q100,62 107,66" stroke="#ffc2d1" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".8"/>
        </svg>
      </div>

      <div class="tap-ring"></div>
    </div>

    <div class="caption">
      <p id="hint" class="hint" role="status"><span class="hint-dot"></span><span id="hintText">Tap the ribbon to untie it</span></p>
      <div class="after">
        <p id="message" class="message"></p>
        <button id="replay" class="replay" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M5 3.5V8h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Wrap it again
        </button>
      </div>
    </div>
  </div>

  <button id="sound" class="sound" type="button" aria-label="Sound" aria-pressed="true">
    <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <canvas id="fx" aria-hidden="true"></canvas>
  <p id="live" class="sr-only" aria-live="polite"></p>
</main>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const scene = $("#scene"), gift = $("#gift"), hint = $("#hint"), hintText = $("#hintText");
  const soundBtn = $("#sound"), replayBtn = $("#replay"), live = $("#live");

  /* ---------- personalise: index.html?name=Ava&msg=Your%20message ---------- */
  const params = new URLSearchParams(location.search);
  const clean = (v, max) => (v || "").replace(/\s+/g, " ").trim().slice(0, max);
  const name = clean(params.get("name"), 20);
  const message = clean(params.get("msg"), 140) || "May your year bloom as beautifully as these flowers.";

  const greet = $("#greet");
  const addWord = (text, i) => {
    const s = document.createElement("span");
    s.className = "word";
    s.style.setProperty("--i", i);
    s.textContent = text;
    greet.appendChild(s);
  };
  addWord("Happy", 0);
  greet.appendChild(document.createTextNode(" "));
  addWord(name ? "Birthday," : "Birthday!", 1);
  if (name) {
    scene.classList.add("has-name");
    greet.appendChild(document.createElement("br"));
    addWord(name + "!", 2);
  }
  $("#message").textContent = message;
  $("#tagText").textContent = name ? "For " + name : "For you ♡";

  /* ---------- background bokeh ---------- */
  const bokeh = $(".bokeh");
  const bokehColors = ["rgba(255,255,255,.9)", "rgba(255,182,203,.7)", "rgba(255,214,140,.5)", "rgba(170,236,222,.45)"];
  for (let i = 0; i < 14; i++) {
    const b = document.createElement("i");
    const size = rand(30, 150);
    b.style.cssText = `width:${size}px;height:${size}px;left:${rand(-5, 100)}%;top:${rand(-5, 100)}%`;
    b.style.setProperty("--c", pick(bokehColors));
    b.style.setProperty("--t", rand(6, 14).toFixed(1) + "s");
    b.style.setProperty("--dl", -rand(0, 10).toFixed(1) + "s");
    b.style.setProperty("--dx", rand(-40, 40).toFixed(0) + "px");
    b.style.setProperty("--dy", rand(-50, 50).toFixed(0) + "px");
    bokeh.appendChild(b);
  }

  /* ---------- flower bouquet (SVG, viewBox 300 x 400) ---------- */
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const DEG = Math.PI / 180;
  const ring = (n, dist, r, fill, stroke, sw, off = 0) => {
    let s = "";
    for (let i = 0; i < n; i++) {
      const a = (i * 360 / n + off - 90) * DEG;
      s += `<circle cx="${(Math.cos(a) * dist).toFixed(1)}" cy="${(Math.sin(a) * dist).toFixed(1)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    }
    return s;
  };
  const shine = (x, y, rx, ry) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" opacity=".22" transform="rotate(-30 ${x} ${y})"/>`;

  const ROSE = {
    red:   { base: "#e63950", mid: "#f4607a", dark: "#a81e3a" },
    pink:  { base: "#ff8fb0", mid: "#ffb6cb", dark: "#d9567f" },
    coral: { base: "#ff9a76", mid: "#ffc0a6", dark: "#d96a45" },
    deep:  { base: "#d1245a", mid: "#ea4b7b", dark: "#8e1239" },
    blush: { base: "#ffc2d6", mid: "#ffdbe7", dark: "#ee93b2", light: "#fff2f6" },
  };
  const TULIP = {
    pink:  { base: "#ff7aa2", mid: "#ffa6c1", dark: "#cf4875" },
    peach: { base: "#ffb27a", mid: "#ffd0a8", dark: "#df8547" },
  };

  const DRAW = {
    rose: (c) =>
      ring(5, 11, 12.5, c.base, c.dark, 1.2) + `<circle r="12" fill="${c.base}"/>` +
      ring(4, 5.5, 8.5, c.mid, c.dark, 1, 45) + `<circle r="6" fill="${c.mid}"/>` +
      `<path d="M-4.5,1.5 C-5,-4 2,-6 4.5,-2 C6.5,2 1.5,5.5 -1.5,3.5 C-3,2 -1.5,-.5 1,.5" fill="none" stroke="${c.dark}" stroke-width="1.5" stroke-linecap="round"/>` +
      shine(-8, -11, 6, 3),
    peony: (c) =>
      ring(9, 15, 13, c.base, c.dark, .9) + `<circle r="15" fill="${c.base}"/>` +
      ring(7, 9, 10, c.mid, c.dark, .8, 20) + `<circle r="9" fill="${c.mid}"/>` +
      ring(5, 4.5, 6.5, c.light, c.dark, .7, 10) + `<circle r="4" fill="${c.light}"/>` +
      `<path d="M-2.5,.5 C-2.5,-2.5 2.5,-2.5 2.5,.5" fill="none" stroke="${c.dark}" stroke-width="1.2" stroke-linecap="round"/>` +
      shine(-11, -15, 8, 4),
    daisy: () => {
      let s = "";
      for (let i = 0; i < 14; i++) s += `<ellipse cx="0" cy="-12.5" rx="4.2" ry="11" fill="#fff" stroke="#eadfe8" stroke-width=".8" transform="rotate(${(i * 360 / 14).toFixed(1)})"/>`;
      return s + `<circle r="7.5" fill="#ffc83d" stroke="#eea320" stroke-width="1.2"/><circle cx="-2" cy="-1.5" r="1.2" fill="#e08e10"/><circle cx="2.5" cy="-.5" r="1.1" fill="#e08e10"/><circle cx="-.3" cy="2.7" r="1.1" fill="#e08e10"/><circle cx="-2.6" cy="-3" r="2.4" fill="#fff" opacity=".4"/>`;
    },
    tulip: (c) =>
      `<path d="M-13,6 C-15,-10 -10,-20 -5,-22 L0,-13 L5,-22 C10,-20 15,-10 13,6 C9,17 -9,17 -13,6 Z" fill="${c.base}" stroke="${c.dark}" stroke-width="1.2" stroke-linejoin="round"/>` +
      `<path d="M0,-16 C-6,-6 -6,8 0,15 C6,8 6,-6 0,-16 Z" fill="${c.mid}" opacity=".9"/>` +
      `<path d="M-9,-3 C-8,5 -4,11 0,13" stroke="#fff" stroke-width="2" fill="none" opacity=".3" stroke-linecap="round"/>`,
    bud: (c) =>
      `<path d="M0,-13 C9,-8 9,5 0,10 C-9,5 -9,-8 0,-13 Z" fill="${c.base}" stroke="${c.dark}" stroke-width="1.1"/>` +
      `<path d="M0,-13 C4,-6 4,4 0,10" stroke="${c.dark}" stroke-width="1" fill="none"/>` +
      `<path d="M-8,2 C-6,10 -2,12 0,12 C2,12 6,10 8,2 C4,7 2,6 0,9 C-2,6 -4,7 -8,2 Z" fill="#4caf6e"/>`,
    bb: () => {
      const pts = [[0, -2, 3.4], [-8, -6, 2.8], [7, -8, 3], [-2, -13, 2.6], [9, 2, 2.6], [-10, 4, 2.4], [3, 7, 2.8], [12, -12, 2.2], [-12, -12, 2.2]];
      let s = "";
      pts.forEach(([x, y]) => (s += `<path d="M0,16 Q${(x * .4).toFixed(1)},${((y + 16) / 2).toFixed(1)} ${x},${y}" stroke="#7fb98f" stroke-width=".8" fill="none"/>`));
      pts.forEach(([x, y, r]) => (s += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#f1d5e1" stroke-width=".7"/>`));
      return s;
    },
    leaf: (v) =>
      `<path d="M0,0 C12,-10 13,-32 0,-48 C-13,-32 -12,-10 0,0 Z" fill="url(#${v ? "leafB" : "leafA"})"/>` +
      `<path d="M0,-3 C1,-18 1,-30 0,-42" stroke="#256f45" stroke-width="1.2" fill="none" opacity=".5"/>`,
    sprig: () =>
      `<path d="M0,0 C3,-14 -2,-30 0,-46" stroke="#5a9e7c" stroke-width="1.6" fill="none"/>` +
      [[5, -9, 4.6], [-5, -17, 4.4], [5, -25, 4.2], [-4.5, -33, 3.8], [3, -40, 3.4], [0, -47, 3]]
        .map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#a3d4b7" stroke="#5f9f80" stroke-width=".8"/>`).join(""),
  };

  const LEAVES = [
    { x: 58, y: 172, a: -62, s: 1.1 }, { x: 242, y: 172, a: 62, s: 1.1, v: 1 },
    { x: 78, y: 122, a: -36, s: .95, v: 1 }, { x: 222, y: 122, a: 36, s: .95 },
    { x: 112, y: 88, a: -14, s: .8 }, { x: 190, y: 88, a: 16, s: .8, v: 1 },
    { x: 72, y: 206, a: -84, s: .95, v: 1 }, { x: 228, y: 206, a: 84, s: .95 },
    { x: 50, y: 200, a: -70, s: 1, t: "sprig" }, { x: 250, y: 200, a: 70, s: 1, t: "sprig" },
  ];
  // drawn back to front
  const FLOWERS = [
    { t: "tulip", x: 98, y: 78, c: TULIP.pink, r: -14 },
    { t: "tulip", x: 202, y: 78, c: TULIP.peach, r: 14 },
    { t: "bb", x: 62, y: 116 }, { t: "bb", x: 238, y: 116 }, { t: "bb", x: 150, y: 50, s: .9 },
    { t: "rose", x: 150, y: 86, c: ROSE.red },
    { t: "daisy", x: 62, y: 152, s: .95, r: 8 }, { t: "daisy", x: 238, y: 152, s: .95, r: -6 },
    { t: "rose", x: 108, y: 126, c: ROSE.pink, s: 1.05, r: 20 },
    { t: "rose", x: 192, y: 126, c: ROSE.coral, s: 1.05, r: -25 },
    { t: "peony", x: 150, y: 142, c: ROSE.blush, s: 1.12 },
    { t: "bb", x: 102, y: 176, s: .85 }, { t: "bb", x: 198, y: 176, s: .85 },
    { t: "daisy", x: 92, y: 194, s: .88, r: 4 }, { t: "daisy", x: 208, y: 194, s: .88, r: -10 },
    { t: "rose", x: 150, y: 196, c: ROSE.deep, s: .95, r: 40 },
    { t: "bud", x: 122, y: 212, c: ROSE.pink, r: -12 },
    { t: "bud", x: 178, y: 212, c: ROSE.coral, r: 12 },
  ];

  (function buildBouquet() {
    const leaves = $("#bq-leaves"), stems = $("#bq-stems"), flowers = $("#bq-flowers");
    const delay = (x, y, base) => (base + Math.hypot(x - 150, y - 140) / 150 * .75).toFixed(2) + "s";
    LEAVES.forEach((l) => {
      const g = svgEl("g", { class: "leaf", transform: `translate(${l.x} ${l.y}) rotate(${l.a}) scale(${l.s})` }, leaves);
      const b = svgEl("g", { class: "bloom" }, g);
      b.style.setProperty("--d", delay(l.x, l.y, .5));
      b.innerHTML = l.t === "sprig" ? DRAW.sprig() : DRAW.leaf(l.v);
    });
    FLOWERS.forEach((f) => {
      if (f.t !== "bb") {
        const gx = 150 + (f.x - 150) * .1;
        svgEl("path", {
          class: "stem", pathLength: "1",
          d: `M${gx},336 Q${((gx + f.x) / 2 + (f.x - 150) * .15).toFixed(1)},${((336 + f.y) / 2).toFixed(1)} ${f.x},${f.y}`,
        }, stems);
      }
      const g = svgEl("g", { transform: `translate(${f.x} ${f.y}) rotate(${f.r || 0}) scale(${f.s || 1})` }, flowers);
      const b = svgEl("g", { class: "bloom" }, g);
      b.style.setProperty("--d", delay(f.x, f.y, .62));
      b.innerHTML = DRAW[f.t](f.c);
    });
  })();

  /* ---------- canvas effects: confetti, sparkles, falling petals ---------- */
  const FX = (() => {
    const cvs = $("#fx"), ctx = cvs.getContext("2d");
    let W = 0, H = 0, parts = [], raf = 0, last = 0, petalsOn = false, petalClock = 0;
    const CONFETTI = ["#ff6b8f", "#ffd166", "#3fcdb7", "#b8a1ff", "#ff9a76", "#ffffff", "#ff8fb0"];
    const PETALS = ["#ffb6cb", "#ff8fb0", "#ffc2d6", "#ffa48a", "#ffe3ec"];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
      cvs.style.width = W + "px"; cvs.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", resize);
    resize();

    const run = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } };

    function burst(x, y, o = {}) {
      let count = o.count ?? 120;
      if (reduceMotion) count = Math.round(count * .3);
      const angle = o.angle ?? -Math.PI / 2, spread = o.spread ?? Math.PI * .9;
      const [s0, s1] = o.speed ?? [6, 14], [z0, z1] = o.size ?? [6, 11], [d0, d1] = o.decay ?? [.006, .011];
      const shapes = o.shapes ?? ["rect", "rect", "circle", "heart"], colors = o.colors ?? CONFETTI;
      for (let i = 0; i < count; i++) {
        const a = angle + rand(-spread / 2, spread / 2), v = rand(s0, s1);
        parts.push({
          x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.gravity ?? .22, drag: o.drag ?? .975,
          rot: rand(0, 6.28), vr: rand(-.25, .25), size: rand(z0, z1), color: pick(colors), shape: pick(shapes),
          life: 1, decay: rand(d0, d1), flip: rand(0, 6.28), vflip: rand(.08, .2),
        });
      }
      run();
    }
    const sparkle = (x, y, count = 26) => burst(x, y, {
      count, spread: Math.PI * 2, angle: 0, speed: [2, 6.5], shapes: ["star", "star", "circle"],
      colors: ["#ffffff", "#ffd166", "#ffb6cb"], gravity: .06, drag: .95, size: [6, 12], decay: [.018, .03],
    });
    function petal() {
      parts.push({
        x: rand(-20, W + 20), y: -20, vx: rand(-.4, .4), vy: rand(.7, 1.4), g: 0, drag: 1,
        rot: rand(0, 6.28), vr: rand(-.03, .03), size: rand(8, 13), color: pick(PETALS), shape: "petal",
        life: 1, decay: 0, sway: rand(.4, 1.2), ph: rand(0, 6.28), sp: rand(.02, .045), flip: rand(0, 6.28), vflip: rand(.03, .07),
      });
    }

    function heart(s) {
      const k = s / 2;
      ctx.beginPath(); ctx.moveTo(0, k * .6);
      ctx.bezierCurveTo(-k * 1.4, -k * .3, -k * .5, -k * 1.3, 0, -k * .45);
      ctx.bezierCurveTo(k * .5, -k * 1.3, k * 1.4, -k * .3, 0, k * .6);
      ctx.fill();
    }
    function star(s) {
      const r = s / 2, r2 = r * .3;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const rr = i % 2 ? r2 : r, a = i * Math.PI / 4; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill();
    }
    function petalShape(s) {
      ctx.beginPath(); ctx.moveTo(0, -s / 2);
      ctx.bezierCurveTo(s * .55, -s * .3, s * .4, s * .4, 0, s / 2);
      ctx.bezierCurveTo(-s * .4, s * .4, -s * .55, -s * .3, 0, -s / 2);
      ctx.fill();
    }
    function draw(p) {
      ctx.globalAlpha = (p.life < .35 ? p.life / .35 : 1) * (p.shape === "petal" ? .9 : 1);
      ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const s = p.size;
      switch (p.shape) {
        case "rect": ctx.scale(1, Math.cos(p.flip)); ctx.fillRect(-s / 2, -s / 4, s, s / 2); break;
        case "circle": ctx.beginPath(); ctx.arc(0, 0, s / 3, 0, 6.283); ctx.fill(); break;
        case "heart": ctx.scale(Math.cos(p.flip), 1); heart(s); break;
        case "star": star(s); break;
        case "petal": ctx.scale(1, .55 + .45 * Math.abs(Math.cos(p.flip))); petalShape(s); break;
      }
      ctx.restore();
    }
    function tick(now) {
      const dt = Math.min(48, now - last) / 16.667; last = now;
      ctx.clearRect(0, 0, W, H);
      if (petalsOn && !reduceMotion) {
        petalClock += dt;
        if (petalClock > 14) { petalClock = 0; if (parts.filter((p) => p.shape === "petal").length < 36) petal(); }
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i], d = Math.pow(p.drag, dt);
        p.vx *= d; p.vy = p.vy * d + p.g * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.flip += p.vflip * dt; p.life -= p.decay * dt;
        if (p.shape === "petal") { p.ph += p.sp * dt; p.x += Math.sin(p.ph) * p.sway * dt; }
        if (p.life <= 0 || p.y > H + 40) { parts.splice(i, 1); continue; }
        draw(p);
      }
      ctx.globalAlpha = 1;
      if (parts.length || petalsOn) raf = requestAnimationFrame(tick);
      else { raf = 0; ctx.clearRect(0, 0, W, H); }
    }
    return {
      burst, sparkle,
      petals(on) { petalsOn = on; if (on) run(); },
      clear() { parts.length = 0; },
    };
  })();

  /* ---------- tiny synth: swish, pop, chime, music-box tune ---------- */
  const Sound = (() => {
    let ac = null, master = null, musicBus = null, noiseBuf = null, muted = false;
    try { muted = localStorage.getItem("gift-muted") === "1"; } catch (e) {}

    function init() {
      if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : .9; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return ac;
    }
    const ready = () => !!init() && !muted;

    function tone(f, t, dur, { type = "sine", vol = .2, attack = .005, to = null, dest = master } = {}) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * .9);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(dest);
      o.start(t); o.stop(t + dur + .05);
    }
    function noise(t, dur, { vol = .2, f1 = 800, f2 = 3000, q = 1 } = {}) {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noiseBuf; f.type = "bandpass"; f.Q.value = q;
      f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + dur * .3);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t); s.stop(t + dur + .05);
    }
    const freq = (n) => {
      const m = /^([A-G])(\d)$/.exec(n);
      const semi = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 }[m[1]] + (m[2] - 4) * 12;
      return 440 * Math.pow(2, semi / 12);
    };
    // "Happy Birthday to You" (public domain), [note, beats]
    const TUNE = [
      ["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["C5", 1], ["B4", 2],
      ["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["D5", 1], ["C5", 2],
      ["G4", .75], ["G4", .25], ["G5", 1], ["E5", 1], ["C5", 1], ["B4", 1], ["A4", 2],
      ["F5", .75], ["F5", .25], ["E5", 1], ["C5", 1], ["D5", 1], ["C5", 3],
    ];
    const bell = (f, t, dest) => {
      tone(f, t, 1.4, { vol: .13, dest });
      tone(f * 2, t, .5, { vol: .04, dest });
      tone(f * 3, t, .18, { vol: .015, type: "triangle", dest });
    };
    function stopMusic() {
      if (musicBus && ac) {
        const g = musicBus;
        g.gain.setTargetAtTime(0, ac.currentTime, .05);
        setTimeout(() => g.disconnect(), 500);
        musicBus = null;
      }
    }
    return {
      unlock: init,
      swish() {
        if (!ready()) return;
        const t = ac.currentTime;
        noise(t, .32, { vol: .22, f1: 500, f2: 4200, q: .9 });
        tone(1318.5, t + .08, .35, { type: "triangle", vol: .05 });
        tone(1760, t + .14, .4, { vol: .04 });
      },
      pop() {
        if (!ready()) return;
        const t = ac.currentTime;
        tone(190, t, .22, { vol: .35, to: 60 });
        tone(760, t, .09, { vol: .18, to: 260 });
        noise(t, .08, { vol: .12, f1: 1500, f2: 600, q: .7 });
      },
      chime() {
        if (!ready()) return;
        const t = ac.currentTime;
        [1046.5, 1318.5, 1568, 2093, 2637].forEach((f, i) => {
          tone(f, t + i * .07, 1.2, { vol: .08 });
          tone(f * 2, t + i * .07, .4, { vol: .015, type: "triangle" });
        });
      },
      melody() {
        if (!ready()) return;
        stopMusic();
        musicBus = ac.createGain(); musicBus.gain.value = .9; musicBus.connect(master);
        let t = ac.currentTime + .05;
        for (const [n, beats] of TUNE) { bell(freq(n) * 2, t, musicBus); t += beats * .4; }
      },
      stopMusic,
      setMuted(m) {
        muted = m;
        try { localStorage.setItem("gift-muted", m ? "1" : "0"); } catch (e) {}
        if (master) master.gain.setTargetAtTime(m ? 0 : .9, ac.currentTime, .03);
      },
      get muted() { return muted; },
    };
  })();

  /* ---------- the tap sequence ---------- */
  let step = 0, busy = false, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
  const center = (el, fy = .5) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height * fy]; };

  function setHint(text) {
    hint.classList.add("swap");
    later(() => { hintText.textContent = text; hint.classList.remove("swap"); }, 220);
  }
  function lock(ms) {
    busy = true; scene.classList.add("busy");
    later(() => { busy = false; scene.classList.remove("busy"); }, ms);
  }

  function untie() {
    step = 1; lock(1000);
    scene.classList.add("untied");
    buzz(15);
    Sound.swish();
    FX.sparkle(...center($("#bowKnot")));
    later(() => setHint("Tap again to lift the lid"), 600);
    gift.setAttribute("aria-label", "Gift box with the ribbon untied. Tap to lift the lid.");
  }

  function openGift() {
    step = 2; busy = true;
    scene.classList.add("busy", "open");
    buzz([10, 40, 25]);
    Sound.pop();
    later(() => {
      const [x, y] = center($(".box-inner"), 0);
      FX.burst(x, y, { count: 140 });
      Sound.chime();
    }, 480);
    later(() => FX.sparkle(...center($(".bouquet"), .35), 40), 1150);
    later(() => {
      FX.burst(-10, innerHeight * .85, { count: 60, angle: -Math.PI / 3, spread: .6, speed: [11, 19] });
      FX.burst(innerWidth + 10, innerHeight * .85, { count: 60, angle: -Math.PI * 2 / 3, spread: .6, speed: [11, 19] });
    }, 1300);
    later(() => Sound.melody(), 1500);
    later(() => FX.petals(true), 1700);
    later(() => { live.textContent = greet.textContent + " " + message; }, 1600);
    gift.setAttribute("aria-label", "Your gift is open: a bouquet of flowers.");
  }

  function advance() {
    if (busy) return;
    Sound.unlock();
    if (step === 0) untie();
    else if (step === 1) openGift();
  }

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    Sound.stopMusic(); FX.petals(false); FX.clear();
    busy = true;
    scene.classList.add("resetting");
    setTimeout(() => {
      scene.classList.remove("untied", "open", "busy");
      hint.classList.remove("swap");
      hintText.textContent = "Tap the ribbon to untie it";
      gift.setAttribute("aria-label", "A wrapped birthday gift. Tap to untie the ribbon.");
      live.textContent = "";
      void scene.offsetWidth; // let the closed state apply before fading back in
      scene.classList.remove("resetting");
      step = 0; busy = false;
    }, 330);
  }

  scene.addEventListener("click", (e) => { if (!e.target.closest("button")) advance(); });
  gift.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advance(); }
  });
  replayBtn.addEventListener("click", reset);

  const syncSound = () => soundBtn.setAttribute("aria-pressed", String(!Sound.muted));
  syncSound();
  soundBtn.addEventListener("click", () => { Sound.unlock(); Sound.setMuted(!Sound.muted); syncSound(); });
})();
</script>
</body>
</html>
